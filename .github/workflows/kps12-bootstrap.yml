name: Temporary KPS 12 baseline export
on:
  push:
    branches: [feat/kps12-entity-architecture]
    paths: [.github/workflows/kps12-bootstrap.yml]
permissions:
  contents: read
jobs:
  export:
    if: github.repository == 'xiongxianfei/english-linguistics-kps'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 034f21daa6946b744b367515cb4dbfc6a6720c4f
          persist-credentials: false
      - name: Archive pinned migration input
        run: git archive --format=zip --output=kps9-baseline.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kps9-baseline
          path: kps9-baseline.zip
          retention-days: 1
          if-no-files-found: error
