name: Temporary pronunciation Practice materialization
on:
  push:
    branches: [feat/general-american-practices]
    paths: ['.practice-build/**']
permissions:
  contents: read
concurrency:
  group: pronunciation-practice-materialization
  cancel-in-progress: false
jobs:
  materialize:
    if: github.repository == 'xiongxianfei/english-linguistics-kps'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Apply integrity checked authored content and run validation
        run: python3 .practice-build/apply.py
      - name: Commit verified changes only to the implementation branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r --ignore-unmatch .practice-build
          git add -- README.md SCOPE.md PRONUNCIATION.md CHANGELOG.md CHECKS.md practices references tests data/pronunciation-practice-validation.json INDEX.md COVERAGE.md REVIEW-QUEUE.md knowledge-graph.json summary-dependencies.json
          git commit -m 'feat: add integrated General American word and phone Practices'
          git push origin HEAD:refs/heads/feat/general-american-practices
