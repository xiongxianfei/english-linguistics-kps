name: Temporary practice source snapshot
on:
  push:
    branches: [feat/general-american-practices]
    paths: ['.github/workflows/practice-export.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d0c0874d920be1acc34fe266e94acad6ef4c67fd
          persist-credentials: false
      - name: Archive tracked public source only
        run: git archive --format=zip --output=source-snapshot.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: practice-source-snapshot
          path: source-snapshot.zip
          retention-days: 1
          if-no-files-found: error
