name: One time draft materialization
on:
  push:
    branches: [build/stages-0-7-draft]
    paths: ['.bootstrap/**']
permissions:
  contents: read
concurrency:
  group: initial-kps-materialization
  cancel-in-progress: false
jobs:
  materialize:
    if: github.repository == 'xiongxianfei/english-linguistics-kps'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Build and check the authored provisional package
        run: python3 .bootstrap/seed.py
      - name: Remove one-time writer and commit only to implementation branch
        shell: bash
        run: |
          set -euo pipefail
          git rm -r --ignore-unmatch .bootstrap .github/workflows/bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'feat: materialize provisional English KPS Stages 0 through 7'
          git push origin HEAD:refs/heads/build/stages-0-7-draft
