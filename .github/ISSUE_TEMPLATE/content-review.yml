name: KPS 12 content or architecture review
description: Report a bounded claim, mapping, classification or evidence issue.
title: "review: "
body:
  - type: input
    id: entity
    attributes:
      label: Entity ID and version
      description: Include the affected claim or interface ID where possible.
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: Issue and expected correction
      description: Separate structural conformance from linguistic correctness.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Inspected evidence and limits
      description: Provide passage locators, counterexamples, variety and theoretical scope. Do not upload restricted sources or private learner data.
  - type: textarea
    id: checks
    attributes:
      label: Reproduction or validation
      description: Include commands actually run, not intended tests.
